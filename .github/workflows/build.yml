name: Firmware Build

# Baut die Firmware für das eigene Board (halfile aus platformio.ini,
# aktuell ttgov21new.h = LILYGO TTGO LoRa32 V2.1 1.6.x).
# Bei einem Tag "v*" wird zusätzlich ein GitHub-Release mit den .bin-Dateien angelegt.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Provide sample credential files
        run: |
          cp shared/ota_sample.conf shared/ota.conf
          cp shared/loraconf_sample.h shared/loraconf.h

      - name: Build firmware
        run: pio run -e usb

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp .pio/build/usb/firmware_*.bin dist/
          cp .pio/build/usb/bootloader.bin .pio/build/usb/partitions.bin dist/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
